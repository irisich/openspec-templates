name: epm-analytics-template
version: 1
description: EPM "Постановка" workflow - proposal (задача/решение/критерии) → specs → change (техническое описание) → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Задача, решение, критерии приёмки и договорённости
    template: proposal.md
    instruction: |
      Создать proposal-документ, описывающий, ЗАЧЕМ нужно изменение, и критерии его приёмки.

      Разделы (по шаблону proposal.md):
      - **Глоссарий** (опционально): термины, специфичные для этого изменения.
      - **Какую задачу решаем**: краткое описание задачи/проблемы. Что не так сейчас и почему это нужно сделать.
      - **Краткое описание решения**: верхнеуровневое описание решения (1-2 абзаца). Детали реализации - в design.md, не здесь.
      - **Критерии приёмки**: список критериев приёмки от разных стейкхолдеров, средний уровень детализации (не "должно работать", но и не разбито на элементарные CRUD-операции). Не дублировать критерии из других документов - ссылаться на них.
      - **Договорённости**: договорённости/согласования по этому изменению. Если их пока нет - раздел не удалять.
      - **Возможности**: определяет, какие спеки будут созданы/изменены:
        - **Новые возможности**: новые возможности. Каждая создаёт `specs/<name>/spec.md`. kebab-case имена (например, `user-auth`, `data-export`).
        - **Изменённые возможности**: существующие возможности, чьи ТРЕБОВАНИЯ меняются (не только реализация). Только если меняется поведение на уровне спеки. Проверить `openspec/specs/` на существующие имена. Оставить пустым, если требования не меняются.
      - **Влияние**: затрагиваемый код, API, зависимости, системы.

      ВАЖНО: раздел "Возможности" критичен - это контракт между proposal и specs.
      Изучите существующие спеки перед заполнением. Каждая указанная возможность
      потребует соответствующий spec-файл.

      Каждое изменение должно либо объявить хотя бы одну возможность (новую или
      изменённую), либо явно отказаться от specs: `openspec validate` отклоняет
      изменение с нулевым числом дельт, если в `.openspec.yaml` изменения не
      установлено `skip_specs: true`. Используйте `skip_specs: true` только
      когда нет изменений поведения на уровне спеки (чистый рефакторинг,
      тулинг, документация) - специфика описывает поведение, если поведение не
      меняется, спека тоже не должна меняться. Не придумывайте требование
      только ради прохождения валидации.

      Держите документ кратким (1-2 страницы для Why/Какую задачу решаем/Возможности/Влияние).
      Раздел "## Why" оставлен по-английски намеренно - его требует парсер OpenSpec.
      Разделы "Какую задачу решаем"/"Краткое описание решения"/"Критерии
      приёмки"/"Договорённости" могут быть длиннее при необходимости - это
      основной документ для согласования с бизнесом.

      Это основа - specs, change и tasks строятся поверх этого документа.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Создать файлы спецификации, определяющие, ЧТО должна делать система.

      Спека - это контракт поведения, а не план реализации.

      Хорошее содержание спеки:
      - Наблюдаемое поведение, на которое полагаются пользователи или смежные системы
      - Входы, выходы, условия ошибок
      - Внешние ограничения (безопасность, приватность, надёжность, совместимость)
      - Сценарии, которые можно протестировать или явно проверить

      Чего избегать в спеках:
      - Внутренние имена классов/функций
      - Выбор библиотек или фреймворков
      - Пошаговые детали реализации
      - Подробные планы выполнения (это в design.md или tasks.md)

      Быстрая проверка: если реализацию можно поменять без изменения внешне
      наблюдаемого поведения - скорее всего, это не относится к спеке.

      Создавать один spec-файл на каждую возможность из раздела "Возможности" в proposal.
      - Новые возможности: использовать точное kebab-case имя из proposal (specs/<capability>/spec.md).
      - Изменённые возможности: использовать имя существующей папки спеки из openspec/specs/<capability>/ при создании дельта-спеки в specs/<capability>/spec.md.

      Должен быть хотя бы один spec-файл, если в `.openspec.yaml` изменения не
      установлено `skip_specs: true` (нет изменений поведения на уровне спеки) -
      `openspec validate` отклоняет изменение без дельт без этого маркера. Если
      proposal не перечисляет возможностей и `skip_specs` не установлен -
      сначала вернуться к proposal.

      Delta-операции (заголовки `##`):
      - **ADDED Requirements**: новые возможности
      - **MODIFIED Requirements**: изменённое поведение - ОБЯЗАТЕЛЬНО включать полное обновлённое содержание
      - **REMOVED Requirements**: устаревший функционал - ОБЯЗАТЕЛЬНО включать **Reason** и **Migration**
      - **RENAMED Requirements**: только переименование - формат FROM:/TO:

      Требования к формату:
      - Каждое требование: `### Requirement: <название>`, далее описание
      - Использовать SHALL/MUST для нормативных требований (избегать should/may)
      - Каждый сценарий: `#### Scenario: <название>` в формате WHEN/THEN
      - КРИТИЧНО: у сценария должно быть ровно 4 решётки (`####`). 3 решётки или список без решёток инструмент молча не распознает.
      - У каждого требования должен быть хотя бы один сценарий.

      Только для новых возможностей: дельта-спека открывается разделом
      `## Purpose` - 1-2 предложения (50+ символов, иначе `openspec validate
      --strict` сочтёт слишком коротким) о назначении возможности. При архивации
      он копируется в основную спеку; без него в новой основной спеке останется
      плейсхолдер `TBD ... Update Purpose after archive`, который придётся
      заполнить вручную. НЕ добавлять `## Purpose` в дельту для существующей
      возможности - у её спеки уже есть Purpose, а из дельты он будет
      проигнорирован. Чтобы изменить Purpose существующей возможности (в т.ч.
      оставшийся плейсхолдер `TBD`) - редактировать openspec/specs/<capability>/spec.md напрямую.

      Порядок работы с MODIFIED Requirements:
      1. Найти существующее требование в openspec/specs/<capability>/spec.md
      2. Скопировать ВЕСЬ блок требования (от `### Requirement:` до конца всех сценариев)
      3. Вставить под `## MODIFIED Requirements` и отредактировать под новое поведение
      4. Убедиться, что текст заголовка совпадает точно (без учёта пробелов)

      Типичная ошибка: использование MODIFIED с частичным содержанием теряет
      детали при архивации. Если добавляются новые аспекты без изменения
      существующего поведения - использовать ADDED.

      Заголовки `Purpose`/`ADDED/MODIFIED/REMOVED/RENAMED Requirements`/
      `Requirement:`/`Scenario:` и слова `SHALL`/`MUST` в примере ниже - не
      переводить, они жёстко зашиты в парсере OpenSpec (см. комментарий в
      начале spec.md).

      Пример (новая возможность, поэтому открывается `## Purpose`):
      ```
      ## Purpose

      Позволяет пользователям выгружать свои данные из продукта в переносимом формате.

      ## ADDED Requirements

      ### Requirement: Пользователь может выгрузить данные
      Система SHALL позволять пользователям выгружать свои данные в формате CSV.

      #### Scenario: Успешная выгрузка
      - **WHEN** пользователь нажимает кнопку "Экспорт"
      - **THEN** система скачивает CSV-файл со всеми данными пользователя

      ## REMOVED Requirements

      ### Requirement: Старый способ экспорта
      **Reason**: Заменён новой системой экспорта
      **Migration**: Использовать новый эндпоинт экспорта /api/v2/export
      ```

      Спеки должны быть тестируемыми - каждый сценарий - потенциальный тест-кейс.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Техническое описание изменения (архитектура, API, БД, UI, интеграции, аудит и т.д.)
    template: design.md
    instruction: |
      Создать design-документ, описывающий, КАК реализуется изменение - по образцу
      корпоративного шаблона "Постановка" (Платформа EPM).

      Когда создавать design.md (создавать, только если применимо хоть одно):
      - меняется архитектура сервиса, предоставляемое API или структура БД
      - меняются UI-экраны, печатные формы или ролевая модель
      - меняется интеграционное взаимодействие или жизненный цикл сущности
      - меняется аудит, мониторинг, уведомления, автопроцедуры или системные параметры
      - есть нетривиальный алгоритм/преобразование, миграция данных или особые
        требования к производительности

      Если не применимо ничего (чистый рефакторинг без изменения контрактов,
      тулинг, правка документации) - артефакт пропускается целиком. Сообщить
      об этом пользователю и не возвращаться к решению.

      Каждый раздел шаблона design.md опционален по содержанию, но НЕ
      удаляется целиком: если раздел не применим к изменению, оставить
      заголовок и явно написать "Без изменений" (или принятую в разделе
      формулировку - "Отсутствуют" для архитектуры, "Требования не
      предъявлялись" для аудита/нефункциональных требований) - так на ревью
      видно, что раздел рассмотрен, а не забыт. Это не относится к
      "Любому другому разделу..." - его, наоборот, добавлять только при
      реальной необходимости.

      Внутри применимого раздела - другое правило: перечисляются только
      новые/изменяемые/удаляемые пункты (методы API, таблицы, аудит-события и
      т.п.), то, что не меняется, - не прикладывается.

      Разделы:
      - **Изменение в архитектуре сервиса**: диаграмма в формате C4 (или ссылка на полную архитектуру), явно указать, реализуется ли архитектура полностью или частично.
      - **Изменения в предоставляемом API**: обязателен при доработке бэкенда. Методы полностью описываются в OpenAPI/yml (лежит рядом с постановкой как `openapi.yaml`), в самом design.md - только сводная таблица "Описание методов и полномочий" (новые/изменяемые/удаляемые методы). Плюс подразделы "Изменение в сценарии взаимодействия" (sequence-диаграмма), "Изменения в кодах ошибок".
      - **Изменения в структуре базы данных**: обязателен при доработке бэкенда. Схема таблиц и связей + описание каждой таблицы отдельно.
      - **Изменения в интеграционном взаимодействии**: обязателен при изменении интеграции. Контракт, документация, описание логики (какие поля куда мапятся).
      - **Изменения в жизненном цикле**: обязателен при изменении состояний сущности. State-диаграмма.
      - **Изменения в UI-экранах**: обязателен при доработке фронта. Ссылка на макеты, номер экрана, URL, REST для отображения, таблица динамических элементов.
      - **Изменения в печатных формах**: обязателен, если есть формирование печатных форм. Шаблон + заполнение полей.
      - **Ролевая модель**: обязателен при ролевом разграничении. Всегда указываются ВСЕ роли процесса, а не только изменённые.
      - **Алгоритмы и преобразования**: обязателен при изменении алгоритма/преобразования. Текстовое описание (+ схема при сложной логике).
      - **Изменения в аудите**: обязателен при изменении аудита. Только новые/изменяемые события.
      - **Изменения в мониторинге**: обязателен при изменении метрик. Только новые/изменяемые метрики.
      - **Изменения в уведомлениях**: обязателен при отправке уведомлений (email/sms/push).
      - **Изменения в автопроцедурах**: обязателен при наличии автопроцедур (задачи по расписанию/триггеру).
      - **Изменения в системных параметрах**: обязателен при наличии настраиваемых параметров.
      - **Изменения в нефункциональных требованиях**: обязателен при особых требованиях к производительности/масштабируемости и т.п.
      - **Любой другой раздел, который важно обозначить**: для всего, что не укладывается в шаблон.
      - **Технические решения и риски**: ключевые технические решения с обоснованием (почему X, а не Y), риски/компромиссы (Риск → Митигация), план миграции/отката, открытые вопросы, которые можно безопасно отложить (если они влияют на specs/tasks - решить сейчас, не откладывать).

      Не дублируйте "Какую задачу решаем" / "Краткое описание решения" /
      "Критерии приёмки" / "Договорённости" - они уже есть в proposal.md,
      здесь - только "как", а не "зачем".
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Создать чек-лист, разбивающий реализацию изменения на задачи.

      Перед написанием задач проверить в design.md раздел "Технические решения
      и риски" / открытые вопросы. Если что-то из них повлияет на то, что
      реализуется, - сначала согласовать с пользователем, не закладывать в
      задачи непроговорённое предположение.

      ВАЖНО: инструмент (`openspec status`/`apply`) отслеживает прогресс только
      по буквальному чекбоксу `- [ ]`/`- [x]` в начале строки - задачи без
      этого формата не попадут в трекинг. Счётчик при этом не различает
      код-блоки: чекбоксы внутри ```-блока с примером он считает наравне с
      настоящими, поэтому блок ПРИМЕР из шаблона в готовый tasks.md не
      переносить.

      Правила:
      - Группировать задачи под заголовками `## N. <название>` - нумерация и
        названия групп не парсятся, это условность для читаемости.
      - Каждая задача - чекбокс: `- [ ] X.Y Описание задачи`.
      - Задача должна быть небольшой - выполнима за один присест.
      - Порядок - по зависимости (что нужно сделать раньше).
      - Типовые группы по разделам design.md (взять только затронутые):
        Backend/API, База данных, Frontend/UI, Интеграции, Аудит/мониторинг.
      - Группы "Тестирование" и "Документация / деплой" - обязательные,
        не удалять.

      Пример:
      ```
      ## 1. Backend / API

      - [ ] 1.1 Реализовать эндпоинт POST /v1/export
      - [ ] 1.2 Добавить формирование CSV из данных пользователя

      ## 6. Тестирование

      - [ ] 6.1 Написать unit-тесты на формирование CSV

      ## 7. Документация / деплой

      - [ ] 7.1 Обновить OpenAPI-спецификацию (openapi.yaml)
      ```

      Спеки описывают ЧТО нужно построить, design.md - КАК это строить.
      Каждая задача должна быть проверяемой - должно быть понятно, когда она выполнена.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
